name: cvfuzz

services:
  volume-init:
    image: busybox:1.37.0-musl
    user: "0:0"
    command:
      ["sh", "-c", "mkdir -p /data/web-runs && chown 10001:10001 /data /data/web-runs"]
    volumes:
      - cvfuzz-data:/data
    restart: "no"

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      CVFUZZ_API_HOST: 0.0.0.0
      CVFUZZ_API_PORT: 8020
      CVFUZZ_RUNS_DIR: /data/web-runs
    volumes:
      - cvfuzz-data:/data
    depends_on:
      volume-init:
        condition: service_completed_successfully
    healthcheck:
      test:
        ["CMD", "python", "-c", "from urllib.request import urlopen; urlopen('http://127.0.0.1:8020/health')"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        NEXT_PUBLIC_CVFUZZ_API_URL: /api
        CVFUZZ_API_INTERNAL_URL: http://backend:8020
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${CVFUZZ_WEB_PORT:-3010}:3010"
    restart: unless-stopped

volumes:
  cvfuzz-data:
