version: 1

run:
  baseline_confidence: 0.50
  sample_every_n_frames: 1
  max_frames: 1
  seed: 42
  output_dir: test-runs
  save_failures: true
  inference_batch_size: 2
  inference_image_size: null

failure:
  match_iou: 0.30
  missed_below_confidence: 0.25
  confidence_drop_fraction: 0.50
  localization_iou: 0.50
  detect_class_flip: true

boundary:
  refine: true
  tolerance: 0.10
  max_iterations: 6

transforms:
  exposure:
    search_parameter: stops
    identity_value: 0.0
    render_parameters: {stops: -2.0}
    parameters:
      stops: {values: [-1.0, -2.0, -3.0]}

  low_light:
    search_parameter: stops
    identity_value: 0.0
    render_parameters: {stops: -2.0, noise_std: 6.0}
    parameters:
      stops: {values: [-1.0, -2.0, -3.0]}
      noise_std: {values: [6.0]}

  motion_blur:
    search_parameter: kernel_size
    identity_value: 1
    render_parameters: {kernel_size: 11, angle_degrees: 0}
    parameters:
      kernel_size: {values: [5, 11, 21]}
      angle_degrees: {values: [0]}

  defocus_blur:
    search_parameter: sigma
    identity_value: 0.0
    render_parameters: {sigma: 3.0}
    parameters:
      sigma: {values: [1.0, 3.0, 6.0]}

  jpeg_compression:
    search_parameter: quality
    identity_value: 100
    render_parameters: {quality: 30}
    parameters:
      quality: {values: [70, 30, 5]}

  resolution_degradation:
    search_parameter: scale
    identity_value: 1.0
    render_parameters: {scale: 0.30, interpolation: area}
    parameters:
      scale: {values: [0.60, 0.30, 0.10]}
      interpolation: {values: [area]}

  fog:
    search_parameter: strength
    identity_value: 0.0
    render_parameters: {strength: 0.50}
    parameters:
      strength: {values: [0.20, 0.50, 0.80]}

  partial_occlusion:
    search_parameter: fraction
    identity_value: 0.0
    target_aware: true
    render_parameters: {fraction: 0.50, position: center, color: mean}
    parameters:
      fraction: {values: [0.25, 0.50, 0.75]}
      position: {values: [center]}
      color: {values: [mean]}

  glare:
    search_parameter: intensity
    identity_value: 0.0
    render_parameters:
      intensity: 0.50
      radius_fraction: 0.30
      center_x: 0.50
      center_y: 0.50
    parameters:
      intensity: {values: [0.25, 0.50, 0.80]}
      radius_fraction: {values: [0.30]}
      center_x: {values: [0.50]}
      center_y: {values: [0.50]}
