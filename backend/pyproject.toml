[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "cvfuzz"
version = "0.1.0"
description = "Failure-boundary fuzz testing for computer vision models"
readme = "README.md"
requires-python = ">=3.11,<3.12"
license = { text = "MIT" }
authors = [{ name = "CVFuzz contributors" }]
dependencies = [
  "fastapi>=0.115,<1",
  "numpy>=1.26,<3",
  "opencv-python>=4.8,<6",
  "python-dotenv>=1.0,<2",
  "python-multipart>=0.0.18,<1",
  "PyYAML>=6.0,<7",
  "rich>=13.7,<15",
  "typer>=0.12,<1",
  "uvicorn>=0.34,<1",
]

[project.optional-dependencies]
yolo = ["ultralytics>=8.3,<9"]
dev = [
  "pytest>=8.0,<9",
  "pytest-cov>=5.0,<7",
  "httpx>=0.28,<1",
  "ruff>=0.6,<1",
]

[project.scripts]
cvfuzz = "cvfuzz.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/cvfuzz"]

[tool.hatch.build.targets.wheel.force-include]
"configs/default.yaml" = "cvfuzz/resources/default.yaml"

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
